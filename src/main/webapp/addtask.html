
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Task Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #245b49;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
        }

        .task-card {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .task-card h2 {
            color: #243b32;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .description {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #28785b;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background-color: #28785b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1d5c45;
        }

        footer {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .task-card {
                padding: 22px;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Personal Task Manager</h1>
            <p>Organize your day, one task at a time.</p>
        </div>

        <div class="task-card">

            <h2>Add New Task</h2>
            <p class="description">Enter your task details below.</p>

            <form action="addTask" method="post">

                <div class="form-group">
                    <label for="taskName">Task Name</label>
                    <input
                        type="text"
                        id="taskName"
                        name="taskName"
                        placeholder="e.g. Complete Java practice"
                        maxlength="100"
                        required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your task"
                        maxlength="500"
                        required></textarea>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority" required>
                        <option value="">Select priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dueDate">Due Date</label>
                    <input
                        type="date"
                        id="dueDate"
                        name="dueDate"
                        required>
                </div>

                <button type="submit" class="btn">Save Task</button>

            </form>

        </div>

        <footer>
            <p>Plan better. Stay organized. Get things done.</p>
        </footer>

    </div>

</body>
</html>
